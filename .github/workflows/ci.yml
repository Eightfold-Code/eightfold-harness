name: CI

on:
  pull_request:
permissions:
  contents: read

# Cancel a superseded pull-request run on a new push so a fresh head does not
# queue a second full run behind a stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  eightfold-ci:
    name: eightfold / node 22
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5
        with:
          version: '11.7.0'
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
        timeout-minutes: 15

      - name: Lint
        run: pnpm run lint
        timeout-minutes: 15

      - name: Typecheck
        run: pnpm run typecheck
        timeout-minutes: 15

      - name: Test
        run: pnpm run test
        timeout-minutes: 30

      - name: Build
        run: pnpm run build
        timeout-minutes: 15
