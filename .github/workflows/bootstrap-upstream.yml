name: Bootstrap from DeepSeek Harness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror-upstream:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Mirror DeepSeek Harness into Eightfold main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --bare https://github.com/deepseek-ai/deepseek-harness.git upstream.git
          cd upstream.git
          git remote add eightfold "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force eightfold refs/heads/master:refs/heads/main
          git push --force eightfold 'refs/tags/*:refs/tags/*' || true
